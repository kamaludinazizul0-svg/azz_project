<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Kelola Listing - Admin</title><link rel="icon" href="/images/logo.png" /><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/admin/css/admin.css" /></head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar" data-page="listing"></aside>
  <main class="admin-main">
    <div class="topbar"><div class="topbar-left"><div class="topbar-title">Kelola Listing UMKM</div></div><div class="topbar-right"><a href="/" target="_blank" class="topbar-btn topbar-view-site">🌐 Website</a></div></div>
    <div class="page-content">
      <div class="page-header-admin"><div><h1>🏪 Listing UMKM</h1><p>Kelola produk dan UMKM desa</p></div><button class="btn-admin btn-primary-admin" onclick="openAdd()">➕ Tambah Listing</button></div>
      <div class="admin-card"><div class="admin-card-body"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>No</th><th>Gambar</th><th>Nama</th><th>Kategori</th><th>Harga</th><th>Pemilik</th><th>Aksi</th></tr></thead><tbody id="dataTable"><tr><td colspan="7" style="text-align:center;padding:40px">⏳ Memuat...</td></tr></tbody></table></div></div></div>
    </div>
  </main>
</div>
<div class="admin-modal-overlay" id="formModal"><div class="admin-modal" style="max-width:700px"><div class="admin-modal-header"><span class="admin-modal-title" id="modalTitle">Tambah Listing</span><button class="modal-close-btn" onclick="closeModal('formModal')">✕</button></div><div class="admin-modal-body"><form id="dataForm" onsubmit="saveData(event)"><input type="hidden" id="editId" />
  <div class="form-group"><label class="form-label">Nama Produk/Usaha *</label><input type="text" id="fNama" class="form-control" required /></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="form-group"><label class="form-label">Kategori</label><select id="fKategori" class="form-control"><option>Jamu Tradisional</option><option>Wisata</option><option>Kerajinan</option><option>Lainnya</option></select></div>
    <div class="form-group"><label class="form-label">Harga</label><input type="text" id="fHarga" class="form-control" placeholder="Rp 15.000 - 25.000" /></div>
  </div>
  <div class="form-group"><label class="form-label">Deskripsi</label><textarea id="fDeskripsi" class="form-control" rows="3"></textarea></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="form-group"><label class="form-label">Pemilik</label><input type="text" id="fPemilik" class="form-control" /></div>
    <div class="form-group"><label class="form-label">Kontak (WA)</label><input type="text" id="fKontak" class="form-control" placeholder="6281..." /></div>
  </div>
  <div class="form-group"><label class="form-label">Alamat</label><input type="text" id="fAlamat" class="form-control" /></div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
    <div class="form-group"><label class="form-label">URL Gambar</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="fGambar" class="form-control" style="flex:1" />
        <div style="position:relative;overflow:hidden;flex-shrink:0">
          <button type="button" class="btn-admin btn-light" style="pointer-events:none">📁 Upload</button>
          <input type="file" accept="image/*" style="position:absolute;top:0;left:0;opacity:0;width:100%;height:100%;cursor:pointer" onchange="handleUploadUI(this, 'fGambar')" />
        </div>
      </div>
    </div>
    <div class="form-group"><label class="form-label">Sertifikasi</label><input type="text" id="fSertifikasi" class="form-control" placeholder="P-IRT, Halal" /></div>
  </div>
  <div class="admin-modal-footer" style="padding:16px 0 0;border-top:1px solid var(--border)"><button type="button" class="btn-admin btn-light" onclick="closeModal('formModal')">Batal</button><button type="submit" class="btn-admin btn-primary-admin">💾 Simpan</button></div>
</form></div></div></div>
<script src="/admin/js/sidebar.js"></script>
<script src="/admin/js/admin.js"></script>
<script>
let allData=[];
document.addEventListener('DOMContentLoaded',loadData);
async function loadData(){allData=await adminFetch('/listing')||[];const t=document.getElementById('dataTable');if(!allData.length){t.innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px">Belum ada listing</td></tr>';return;}t.innerHTML=allData.map((l,i)=>`<tr><td>${i+1}</td><td><img src="${l.gambar||'/images/jamu.jpg'}" style="width:60px;height:40px;object-fit:cover;border-radius:6px" onerror="this.src='/images/jamu.jpg'" /></td><td style="font-weight:600">${l.nama}</td><td><span class="badge badge-success">${l.kategori}</span></td><td style="font-size:.88rem">${l.harga}</td><td style="font-size:.85rem;color:var(--text-muted)">${l.pemilik}</td><td><div style="display:flex;gap:6px"><button class="btn-admin btn-warning btn-sm-admin" onclick="openEdit(${l.id})">✏️</button><button class="btn-admin btn-danger btn-sm-admin" onclick="hapus(${l.id})">🗑️</button></div></td></tr>`).join('');}
function openAdd(){document.getElementById('modalTitle').textContent='Tambah Listing';document.getElementById('dataForm').reset();document.getElementById('editId').value='';openModal('formModal');}
function openEdit(id){const l=allData.find(x=>x.id===id);if(!l)return;document.getElementById('modalTitle').textContent='Edit Listing';document.getElementById('editId').value=l.id;document.getElementById('fNama').value=l.nama;document.getElementById('fKategori').value=l.kategori;document.getElementById('fHarga').value=l.harga||'';document.getElementById('fDeskripsi').value=l.deskripsi||'';document.getElementById('fPemilik').value=l.pemilik||'';document.getElementById('fKontak').value=l.kontak||'';document.getElementById('fAlamat').value=l.alamat||'';document.getElementById('fGambar').value=l.gambar||'';document.getElementById('fSertifikasi').value=l.sertifikasi||'';openModal('formModal');}
async function saveData(e){e.preventDefault();const id=document.getElementById('editId').value;const body={nama:document.getElementById('fNama').value,kategori:document.getElementById('fKategori').value,harga:document.getElementById('fHarga').value,deskripsi:document.getElementById('fDeskripsi').value,pemilik:document.getElementById('fPemilik').value,kontak:document.getElementById('fKontak').value,alamat:document.getElementById('fAlamat').value,gambar:document.getElementById('fGambar').value,sertifikasi:document.getElementById('fSertifikasi').value};const r=id?await adminFetch(`/listing/${id}`,{method:'PUT',body:JSON.stringify(body)}):await adminFetch('/listing',{method:'POST',body:JSON.stringify(body)});if(r){showToast('Listing berhasil disimpan');closeModal('formModal');loadData();}}
function hapus(id){confirmDialog('Hapus listing ini?',async()=>{await adminFetch(`/listing/${id}`,{method:'DELETE'});showToast('Listing dihapus');loadData();});}
</script>
</body></html>
