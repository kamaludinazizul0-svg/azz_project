<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Program Prioritas - Admin</title>
  <link rel="icon" href="/images/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar" data-page="program"></aside>
  <main class="admin-main">
    <div class="topbar"><div class="topbar-left"><div class="topbar-title">Kelola Program Prioritas</div></div><div class="topbar-right"><a href="/" target="_blank" class="topbar-btn topbar-view-site">🌐 Lihat Website</a></div></div>
    <div class="page-content">
      <div class="page-header-admin"><div><h1>🖼️ Kelola Program Prioritas</h1><p>Tambah dan edit slide pada halaman beranda</p></div><button class="btn-admin btn-primary-admin" onclick="openAdd()">➕ Tambah Program</button></div>
      <div class="admin-card"><div class="admin-card-header"><h3>Daftar Program</h3></div><div class="admin-card-body"><div class="admin-table-wrap">
        <table class="admin-table"><thead><tr><th>No</th><th>Preview</th><th>Judul</th><th>Deskripsi Singkat</th><th>Urutan</th><th>Aksi</th></tr></thead>
        <tbody id="dataTable"><tr><td colspan="6" style="text-align:center;padding:40px">⏳ Memuat...</td></tr></tbody></table>
      </div></div></div>
    </div>
  </main>
</div>
<div class="admin-modal-overlay" id="formModal"><div class="admin-modal"><div class="admin-modal-header"><span class="admin-modal-title" id="modalTitle">Tambah Program</span><button class="modal-close-btn" onclick="closeModal('formModal')">✕</button></div><div class="admin-modal-body">
  <form id="dataForm" onsubmit="saveData(event)">
    <input type="hidden" id="editId" />
    <div class="form-group"><label class="form-label">Judul *</label><input type="text" id="fJudul" class="form-control" required /></div>
    <div class="form-group"><label class="form-label">Deskripsi Singkat</label><input type="text" id="fDeskripsi Singkat" class="form-control" /></div>
    <div class="form-group"><label class="form-label">URL Gambar *</label>
      <div style="display:flex;gap:8px">
        <input type="text" id="fGambar" class="form-control" required placeholder="/images/hero1.jpg" style="flex:1" />
        <div style="position:relative;overflow:hidden;flex-shrink:0">
          <button type="button" class="btn-admin btn-light" style="pointer-events:none">📁 Upload File</button>
          <input type="file" accept="image/*" style="position:absolute;top:0;left:0;opacity:0;width:100%;height:100%;cursor:pointer" onchange="handleUploadUI(this, 'fGambar')" />
        </div>
      </div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
      <div class="form-group"><label class="form-label">Link</label><input type="text" id="fLink" class="form-control" value="/" /></div>
      <div class="form-group"><label class="form-label">Urutan</label><input type="number" id="fUrutan" class="form-control" value="1" min="1" /></div>
    </div>
    <div class="admin-modal-footer" style="padding:16px 0 0;border-top:1px solid var(--border)"><button type="button" class="btn-admin btn-light" onclick="closeModal('formModal')">Batal</button><button type="submit" class="btn-admin btn-primary-admin">💾 Simpan</button></div>
  </form>
</div></div></div>
<script src="/admin/js/sidebar.js"></script>
<script src="/admin/js/admin.js"></script>
<script>
let allData = [];
document.addEventListener('DOMContentLoaded', loadData);
async function loadData() {
  allData = await adminFetch('/program') || [];
  allData.sort((a,b) => a.urutan - b.urutan);
  const tb = document.getElementById('dataTable');
  if (!allData.length) { tb.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px">Belum ada program</td></tr>'; return; }
  tb.innerHTML = allData.map((s,i) => `<tr>
    <td>${i+1}</td><td><img src="${s.gambar}" style="width:80px;height:50px;object-fit:cover;border-radius:6px" onerror="this.src='/images/hero1.jpg'" /></td>
    <td style="font-weight:600">${s.judul}</td><td style="font-size:0.85rem;color:var(--text-muted)">${s.deskripsi||'-'}</td><td style="text-align:center">${s.urutan}</td>
    <td><div style="display:flex;gap:6px"><button class="btn-admin btn-warning btn-sm-admin" onclick="openEdit(${s.id})">✏️</button><button class="btn-admin btn-danger btn-sm-admin" onclick="hapus(${s.id})">🗑️</button></div></td>
  </tr>`).join('');
}
function openAdd() { document.getElementById('modalTitle').textContent='Tambah Program'; document.getElementById('dataForm').reset(); document.getElementById('editId').value=''; document.getElementById('fUrutan').value=allData.length+1; openModal('formModal'); }
function openEdit(id) { const s=allData.find(x=>x.id===id); if(!s)return; document.getElementById('modalTitle').textContent='Edit Program'; document.getElementById('editId').value=s.id; document.getElementById('fJudul').value=s.judul; document.getElementById('fDeskripsi Singkat').value=s.subjudul||''; document.getElementById('fGambar').value=s.gambar||''; document.getElementById('fLink').value=s.link||'/'; document.getElementById('fUrutan').value=s.urutan||1; openModal('formModal'); }
async function saveData(e) { e.preventDefault(); const id=document.getElementById('editId').value; const body={judul:document.getElementById('fJudul').value,subjudul:document.getElementById('fDeskripsi Singkat').value,gambar:document.getElementById('fGambar').value,link:document.getElementById('fLink').value,urutan:parseInt(document.getElementById('fUrutan').value)}; const r=id?await adminFetch(`/slider/${id}`,{method:'PUT',body:JSON.stringify(body)}):await adminFetch('/program',{method:'POST',body:JSON.stringify(body)}); if(r){showToast('Program berhasil disimpan');closeModal('formModal');loadData();} }
function hapus(id) { confirmDialog('Yakin ingin menghapus program ini?', async()=>{await adminFetch(`/slider/${id}`,{method:'DELETE'});showToast('Program dihapus');loadData();}); }
</script>
</body>
</html>
