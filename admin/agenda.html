<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Agenda Desa - Admin</title><link rel="icon" href="/images/logo.png" /><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/admin/css/admin.css" /></head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar" data-page="agenda"></aside>
  <main class="admin-main">
    <div class="topbar"><div class="topbar-left"><div class="topbar-title">Agenda Desa</div></div><div class="topbar-right"><a href="/" target="_blank" class="topbar-btn topbar-view-site">🌐 Website</a><button class="topbar-btn" data-logout>🚪 Keluar</button></div></div>
    <div class="page-content">
      <div class="page-header-admin"><div><h1>📅 Agenda Kegiatan</h1><p>Kelola agenda dan jadwal kegiatan desa yang akan ditampilkan di website</p></div><button class="btn-admin btn-primary-admin" onclick="openAdd()">➕ Tambah Agenda</button></div>

      <div class="admin-card">
        <div class="admin-card-body">
          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead><tr><th>No</th><th>Judul Kegiatan</th><th>Tanggal</th><th>Waktu</th><th>Lokasi</th><th>Status</th><th>Aksi</th></tr></thead>
              <tbody id="dataTable"><tr><td colspan="7" style="text-align:center;padding:40px">⏳ Memuat...</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Modal Form -->
<div class="admin-modal-overlay" id="formModal">
  <div class="admin-modal" style="max-width:600px">
    <div class="admin-modal-header">
      <span class="admin-modal-title" id="modalTitle">Tambah Agenda</span>
      <button class="modal-close-btn" onclick="closeModal('formModal')">✕</button>
    </div>
    <div class="admin-modal-body">
      <form id="dataForm" onsubmit="saveData(event)">
        <input type="hidden" id="editId" />
        <div class="form-group"><label class="form-label">Judul Kegiatan *</label><input type="text" id="fJudul" class="form-control" required /></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group"><label class="form-label">Tanggal *</label><input type="date" id="fTanggal" class="form-control" required /></div>
          <div class="form-group"><label class="form-label">Waktu</label><input type="text" id="fWaktu" class="form-control" placeholder="08.00 - 12.00 WIB" /></div>
        </div>
        <div class="form-group"><label class="form-label">Lokasi</label><input type="text" id="fLokasi" class="form-control" placeholder="Balai Desa Kauman" /></div>
        <div class="form-group"><label class="form-label">Deskripsi</label><textarea id="fDeskripsi" class="form-control" rows="3"></textarea></div>
        <div class="form-group"><label class="form-label">Status</label>
          <select id="fStatus" class="form-control">
            <option value="Akan Datang">Akan Datang</option>
            <option value="Berlangsung">Berlangsung</option>
            <option value="Selesai">Selesai</option>
            <option value="Dibatalkan">Dibatalkan</option>
          </select>
        </div>
        <div class="form-group" style="display:flex;align-items:center;gap:12px">
          <input type="checkbox" id="fAktif" checked style="width:18px;height:18px;accent-color:var(--primary)" />
          <label for="fAktif" class="form-label" style="margin:0">Tampilkan di website</label>
        </div>
        <div class="admin-modal-footer" style="padding:16px 0 0;border-top:1px solid var(--border)">
          <button type="button" class="btn-admin btn-light" onclick="closeModal('formModal')">Batal</button>
          <button type="submit" class="btn-admin btn-primary-admin">💾 Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/admin/js/sidebar.js"></script>
<script src="/admin/js/admin.js"></script>
<script>
let allData = [];

document.addEventListener('DOMContentLoaded', async () => {
  if (!requireAuth()) return;
  await loadData();
});

async function loadData() {
  // Fetch tanpa auth karena GET /api/agenda tidak perlu auth
  const res = await fetch('/api/agenda');
  allData = res.ok ? await res.json() : [];
  renderTable(allData);
}

function renderTable(data) {
  const tb = document.getElementById('dataTable');
  if (!data.length) {
    tb.innerHTML = `<tr><td colspan="7"><div class="empty-state"><div class="icon">📅</div><h3>Belum ada agenda</h3><p>Klik "Tambah Agenda" untuk menambahkan kegiatan desa</p></div></td></tr>`;
    return;
  }
  tb.innerHTML = data.map((d, i) => {
    const statusColor = {
      'Akan Datang': '#1565c0',
      'Berlangsung': '#2e7d32',
      'Selesai': '#555',
      'Dibatalkan': '#c62828'
    };
    const sc = statusColor[d.status] || '#555';
    return `<tr>
      <td>${i + 1}</td>
      <td><div style="font-weight:600">${d.judul}</div><div style="font-size:0.8rem;color:var(--text-muted)">${d.deskripsi ? d.deskripsi.substring(0,50)+'...' : ''}</div></td>
      <td>${formatDate(d.tanggal)}</td>
      <td>${d.waktu || '-'}</td>
      <td>${d.lokasi || '-'}</td>
      <td><span style="background:${sc}20;color:${sc};padding:4px 10px;border-radius:20px;font-size:0.78rem;font-weight:600">${d.status || 'Akan Datang'}</span></td>
      <td>
        <button class="btn-admin btn-warning btn-sm-admin" onclick="openEdit(${d.id})">✏️ Edit</button>
        <button class="btn-admin btn-danger btn-sm-admin" onclick="deleteData(${d.id})">🗑️ Hapus</button>
      </td>
    </tr>`;
  }).join('');
}

function openAdd() {
  document.getElementById('modalTitle').textContent = 'Tambah Agenda';
  document.getElementById('dataForm').reset();
  document.getElementById('editId').value = '';
  document.getElementById('fAktif').checked = true;
  openModal('formModal');
}

function openEdit(id) {
  const d = allData.find(x => x.id == id);
  if (!d) return;
  document.getElementById('modalTitle').textContent = 'Edit Agenda';
  document.getElementById('editId').value = d.id;
  document.getElementById('fJudul').value = d.judul || '';
  document.getElementById('fTanggal').value = d.tanggal || '';
  document.getElementById('fWaktu').value = d.waktu || '';
  document.getElementById('fLokasi').value = d.lokasi || '';
  document.getElementById('fDeskripsi').value = d.deskripsi || '';
  document.getElementById('fStatus').value = d.status || 'Akan Datang';
  document.getElementById('fAktif').checked = d.aktif !== false;
  openModal('formModal');
}

async function saveData(e) {
  e.preventDefault();
  const editId = document.getElementById('editId').value;
  const body = {
    judul: document.getElementById('fJudul').value,
    tanggal: document.getElementById('fTanggal').value,
    waktu: document.getElementById('fWaktu').value,
    lokasi: document.getElementById('fLokasi').value,
    deskripsi: document.getElementById('fDeskripsi').value,
    status: document.getElementById('fStatus').value,
    aktif: document.getElementById('fAktif').checked,
  };
  let res;
  if (editId) {
    res = await adminFetch(`/agenda/${editId}`, { method: 'PUT', body: JSON.stringify(body) });
  } else {
    res = await adminFetch('/agenda', { method: 'POST', body: JSON.stringify(body) });
  }
  if (res) { showToast('Agenda berhasil disimpan'); closeModal('formModal'); await loadData(); }
}

function deleteData(id) {
  confirmDialog('Hapus agenda ini?', async () => {
    const res = await adminFetch(`/agenda/${id}`, { method: 'DELETE' });
    if (res) { showToast('Agenda dihapus'); await loadData(); }
  });
}
</script>
</body>
</html>
