<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Berita - Admin Desa Kauman</title>
  <link rel="icon" href="/images/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar" data-page="berita"></aside>
  <main class="admin-main">
    <div class="topbar">
      <div class="topbar-left"><div class="topbar-title">Kelola Berita</div><div class="topbar-breadcrumb"><span>Admin</span> / <span>Berita</span></div></div>
      <div class="topbar-right"><a href="/" target="_blank" class="topbar-btn topbar-view-site">🌐 Lihat Website</a></div>
    </div>
    <div class="page-content">
      <div class="page-header-admin">
        <div><h1>📰 Kelola Berita</h1><p>Tambah, edit, dan hapus berita desa</p></div>
        <button class="btn-admin btn-primary-admin" onclick="openAdd()">➕ Tambah Berita</button>
      </div>
      <div class="admin-card">
        <div class="admin-card-header"><h3>Daftar Berita</h3>
          <input type="text" id="searchInput" class="search-input" placeholder="🔍 Cari berita..." style="max-width:250px" oninput="filterBerita()" />
        </div>
        <div class="admin-card-body"><div class="admin-table-wrap">
          <table class="admin-table"><thead><tr><th>No</th><th>Gambar</th><th>Judul</th><th>Kategori</th><th>Tanggal</th><th>Views</th><th>Aksi</th></tr></thead>
          <tbody id="beritaTable"><tr><td colspan="7" style="text-align:center;padding:40px">⏳ Memuat...</td></tr></tbody></table>
        </div></div>
      </div>
    </div>
  </main>
</div>

<!-- Modal -->
<div class="admin-modal-overlay" id="formModal">
  <div class="admin-modal" style="max-width:700px">
    <div class="admin-modal-header"><span class="admin-modal-title" id="modalTitle">Tambah Berita</span><button class="modal-close-btn" onclick="closeModal('formModal')">✕</button></div>
    <div class="admin-modal-body">
      <form id="beritaForm" onsubmit="saveBerita(event)">
        <input type="hidden" id="editId" />
        <div class="form-group"><label class="form-label">Judul *</label><input type="text" id="fJudul" class="form-control" required /></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group"><label class="form-label">Kategori</label><select id="fKategori" class="form-control"><option>Pemerintahan</option><option>Prestasi</option><option>Pariwisata</option><option>UMKM</option><option>Infrastruktur</option><option>Kesehatan</option></select></div>
          <div class="form-group"><label class="form-label">Tanggal</label><input type="date" id="fTanggal" class="form-control" /></div>
        </div>
        <div class="form-group"><label class="form-label">Ringkasan</label><textarea id="fRingkasan" class="form-control" rows="2"></textarea></div>
        <div class="form-group"><label class="form-label">Konten (HTML)</label><textarea id="fKonten" class="form-control" rows="6"></textarea></div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group"><label class="form-label">URL Gambar</label>
            <div style="display:flex;gap:8px">
              <input type="text" id="fGambar" class="form-control" placeholder="/images/berita/..." style="flex:1" />
              <div style="position:relative;overflow:hidden;flex-shrink:0">
                <button type="button" class="btn-admin btn-light" style="pointer-events:none">📁 Upload</button>
                <input type="file" accept="image/*" style="position:absolute;top:0;left:0;opacity:0;width:100%;height:100%;cursor:pointer" onchange="handleUploadUI(this, 'fGambar')" />
              </div>
            </div>
          </div>
          <div class="form-group"><label class="form-label">Penulis</label><input type="text" id="fPenulis" class="form-control" value="Admin Desa" /></div>
        </div>
        <div class="admin-modal-footer" style="padding:16px 0 0;border-top:1px solid var(--border)">
          <button type="button" class="btn-admin btn-light" onclick="closeModal('formModal')">Batal</button>
          <button type="submit" class="btn-admin btn-primary-admin">💾 Simpan</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="/admin/js/sidebar.js"></script>
<script src="/admin/js/admin.js"></script>
<script>
let allBerita = [];
document.addEventListener('DOMContentLoaded', loadBerita);

async function loadBerita() {
  const res = await adminFetch('/berita?limit=100');
  allBerita = res?.data || [];
  renderTable(allBerita);
}

function renderTable(data) {
  const tb = document.getElementById('beritaTable');
  if (!data.length) { tb.innerHTML = '<tr><td colspan="7" class="empty-state"><div class="icon">📰</div><h3>Belum ada berita</h3></td></tr>'; return; }
  tb.innerHTML = data.map((b, i) => `<tr>
    <td>${i+1}</td>
    <td><img src="${b.gambar || '/images/hero1.jpg'}" style="width:60px;height:40px;object-fit:cover;border-radius:6px" onerror="this.src='/images/hero1.jpg'" /></td>
    <td style="max-width:250px"><div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${b.judul}</div></td>
    <td><span class="badge badge-success">${b.kategori}</span></td>
    <td style="white-space:nowrap;font-size:0.85rem">${formatDate(b.tanggal)}</td>
    <td style="text-align:center">${b.dilihat||0}</td>
    <td><div style="display:flex;gap:6px">
      <button class="btn-admin btn-warning btn-sm-admin" onclick="openEdit(${b.id})">✏️</button>
      <button class="btn-admin btn-danger btn-sm-admin" onclick="hapus(${b.id})">🗑️</button>
    </div></td>
  </tr>`).join('');
}

function filterBerita() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  renderTable(allBerita.filter(b => b.judul.toLowerCase().includes(q)));
}

function openAdd() {
  document.getElementById('modalTitle').textContent = 'Tambah Berita';
  document.getElementById('beritaForm').reset();
  document.getElementById('editId').value = '';
  document.getElementById('fTanggal').value = new Date().toISOString().split('T')[0];
  openModal('formModal');
}

function openEdit(id) {
  const b = allBerita.find(x => x.id === id);
  if (!b) return;
  document.getElementById('modalTitle').textContent = 'Edit Berita';
  document.getElementById('editId').value = b.id;
  document.getElementById('fJudul').value = b.judul;
  document.getElementById('fKategori').value = b.kategori;
  document.getElementById('fTanggal').value = b.tanggal;
  document.getElementById('fRingkasan').value = b.ringkasan || '';
  document.getElementById('fKonten').value = b.konten || '';
  document.getElementById('fGambar').value = b.gambar || '';
  document.getElementById('fPenulis').value = b.penulis || 'Admin Desa';
  openModal('formModal');
}

async function saveBerita(e) {
  e.preventDefault();
  const id = document.getElementById('editId').value;
  const body = {
    judul: document.getElementById('fJudul').value,
    kategori: document.getElementById('fKategori').value,
    tanggal: document.getElementById('fTanggal').value,
    ringkasan: document.getElementById('fRingkasan').value,
    konten: document.getElementById('fKonten').value,
    gambar: document.getElementById('fGambar').value,
    penulis: document.getElementById('fPenulis').value,
  };
  const res = id
    ? await adminFetch(`/berita/${id}`, { method: 'PUT', body: JSON.stringify(body) })
    : await adminFetch('/berita', { method: 'POST', body: JSON.stringify(body) });
  if (res) { showToast(id ? 'Berita berhasil diperbarui' : 'Berita berhasil ditambah'); closeModal('formModal'); loadBerita(); }
}

function hapus(id) {
  confirmDialog('Yakin ingin menghapus berita ini?', async () => {
    await adminFetch(`/berita/${id}`, { method: 'DELETE' });
    showToast('Berita dihapus');
    loadBerita();
  });
}
</script>
</body>
</html>
