<!DOCTYPE html>
<html lang="id">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Kelola Perangkat Desa - Admin</title><link rel="icon" href="/images/logo.png" /><link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" /><link rel="stylesheet" href="/admin/css/admin.css" /></head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar" data-page="perangkat"></aside>
  <main class="admin-main">
    <div class="topbar"><div class="topbar-left"><div class="topbar-title">Kelola Perangkat Desa</div></div><div class="topbar-right"><a href="/" target="_blank" class="topbar-btn topbar-view-site">🌐 Website</a></div></div>
    <div class="page-content">
      <div class="page-header-admin"><div><h1>👥 Perangkat Desa</h1><p>Kelola data perangkat/aparatur desa</p></div><button class="btn-admin btn-primary-admin" onclick="openAdd()">➕ Tambah Perangkat</button></div>
      <div class="admin-card"><div class="admin-card-body"><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>No</th><th>Foto</th><th>Nama</th><th>Jabatan</th><th>Periode</th><th>Urutan</th><th>Aksi</th></tr></thead><tbody id="dataTable"><tr><td colspan="7" style="text-align:center;padding:40px">⏳ Memuat...</td></tr></tbody></table></div></div></div>
    </div>
  </main>
</div>
<div class="admin-modal-overlay" id="formModal"><div class="admin-modal"><div class="admin-modal-header"><span class="admin-modal-title" id="modalTitle">Tambah</span><button class="modal-close-btn" onclick="closeModal('formModal')">✕</button></div><div class="admin-modal-body"><form id="dataForm" onsubmit="saveData(event)"><input type="hidden" id="editId" />
  <div class="form-group"><label class="form-label">Nama *</label><input type="text" id="fNama" class="form-control" required /></div>
  <div class="form-group"><label class="form-label">Jabatan *</label><input type="text" id="fJabatan" class="form-control" required /></div>
  <div class="form-group"><label class="form-label">URL Foto</label>
    <div style="display:flex;gap:8px">
      <input type="text" id="fFoto" class="form-control" placeholder="/images/perangkat/..." style="flex:1" />
      <div style="position:relative;overflow:hidden;flex-shrink:0">
        <button type="button" class="btn-admin btn-light" style="pointer-events:none">📁 Upload</button>
        <input type="file" accept="image/*" style="position:absolute;top:0;left:0;opacity:0;width:100%;height:100%;cursor:pointer" onchange="handleUploadUI(this, 'fFoto')" />
      </div>
    </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px"><div class="form-group"><label class="form-label">NIP</label><input type="text" id="fNip" class="form-control" value="-" /></div><div class="form-group"><label class="form-label">Periode</label><input type="text" id="fPeriode" class="form-control" value="2021 - 2027" /></div></div>
  <div class="form-group"><label class="form-label">Tugas Pokok</label><textarea id="fTugas" class="form-control" rows="3" placeholder="Masukkan deskripsi tugas..."></textarea></div>
  <div class="form-group"><label class="form-label">Urutan</label><input type="number" id="fUrutan" class="form-control" value="1" min="1" /></div>
  <div class="admin-modal-footer" style="padding:16px 0 0;border-top:1px solid var(--border)"><button type="button" class="btn-admin btn-light" onclick="closeModal('formModal')">Batal</button><button type="submit" class="btn-admin btn-primary-admin">💾 Simpan</button></div>
</form></div></div></div>
<script src="/admin/js/sidebar.js"></script>
<script src="/admin/js/admin.js"></script>
<script>
let allData=[];
document.addEventListener('DOMContentLoaded',loadData);
async function loadData(){allData=await adminFetch('/perangkat')||[];allData.sort((a,b)=>a.urutan-b.urutan);const t=document.getElementById('dataTable');if(!allData.length){t.innerHTML='<tr><td colspan="7" style="text-align:center;padding:40px">Belum ada data</td></tr>';return;}t.innerHTML=allData.map((p,i)=>`<tr><td>${i+1}</td><td><div style="width:45px;height:45px;border-radius:50%;overflow:hidden;background:var(--bg-page);display:flex;align-items:center;justify-content:center"><img src="${p.foto}" style="width:100%;height:100%;object-fit:cover" onerror="this.outerHTML='<span style=font-size:1.5rem>👤</span>'" /></div></td><td style="font-weight:600">${p.nama}</td><td><span class="badge badge-success">${p.jabatan}</span></td><td style="font-size:.85rem">${p.periode||'-'}</td><td style="text-align:center">${p.urutan}</td><td><div style="display:flex;gap:6px"><button class="btn-admin btn-warning btn-sm-admin" onclick="openEdit(${p.id})">✏️</button><button class="btn-admin btn-danger btn-sm-admin" onclick="hapus(${p.id})">🗑️</button></div></td></tr>`).join('');}
function openAdd(){document.getElementById('modalTitle').textContent='Tambah Perangkat';document.getElementById('dataForm').reset();document.getElementById('editId').value='';document.getElementById('fUrutan').value=allData.length+1;openModal('formModal');}
function openEdit(id){const p=allData.find(x=>x.id===id);if(!p)return;document.getElementById('modalTitle').textContent='Edit Perangkat';document.getElementById('editId').value=p.id;document.getElementById('fNama').value=p.nama;document.getElementById('fJabatan').value=p.jabatan;document.getElementById('fFoto').value=p.foto||'';document.getElementById('fNip').value=p.nip||'-';document.getElementById('fPeriode').value=p.periode||'';document.getElementById('fTugas').value=p.tugas||'';document.getElementById('fUrutan').value=p.urutan||1;openModal('formModal');}
async function saveData(e){e.preventDefault();const id=document.getElementById('editId').value;const body={nama:document.getElementById('fNama').value,jabatan:document.getElementById('fJabatan').value,foto:document.getElementById('fFoto').value,nip:document.getElementById('fNip').value,periode:document.getElementById('fPeriode').value,tugas:document.getElementById('fTugas').value,urutan:parseInt(document.getElementById('fUrutan').value)};const r=id?await adminFetch(`/perangkat/${id}`,{method:'PUT',body:JSON.stringify(body)}):await adminFetch('/perangkat',{method:'POST',body:JSON.stringify(body)});if(r){showToast('Data berhasil disimpan');closeModal('formModal');loadData();}}
function hapus(id){confirmDialog('Yakin ingin menghapus?',async()=>{await adminFetch(`/perangkat/${id}`,{method:'DELETE'});showToast('Data dihapus');loadData();});}
</script>
</body></html>
