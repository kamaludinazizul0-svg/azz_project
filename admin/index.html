<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Admin - Website Desa Kauman</title>
  <link rel="icon" href="/images/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body class="login-body">
  <div class="login-card">
    <div class="login-logo">
      <img src="/images/logo.png" alt="Logo Desa Kauman" onerror="this.style.display='none'" />
      <h1>Desa Kauman</h1>
      <p>Kecamatan Ngoro, Kabupaten Jombang</p>
    </div>
    <div class="login-title">🔐 Masuk ke Panel Admin</div>
    
    <div id="errorMsg" style="display:none;background:#ffebee;color:#c62828;padding:12px 16px;border-radius:8px;font-size:0.88rem;margin-bottom:16px;border-left:4px solid #c62828;"></div>
    
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="username" class="form-control" placeholder="Masukkan username" autocomplete="username" required />
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="Masukkan password" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn-admin btn-primary-admin btn-block" id="loginBtn">
        🔑 Masuk
      </button>
    </form>
    
    <div style="margin-top:24px;padding-top:20px;border-top:1px solid var(--border);text-align:center">
      <a href="/" style="font-size:0.85rem;color:var(--primary);font-weight:600">← Kembali ke Website Desa</a>
    </div>
  </div>

  <script>
    // Check if already logged in
    if (localStorage.getItem('admin_token')) {
      window.location.href = '/admin/dashboard.html';
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errEl = document.getElementById('errorMsg');
      
      btn.textContent = '⏳ Memuat...';
      btn.disabled = true;
      errEl.style.display = 'none';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login gagal');
        
        localStorage.setItem('admin_token', data.token);
        localStorage.setItem('admin_user', JSON.stringify(data.user));
        window.location.href = '/admin/dashboard.html';
      } catch (err) {
        errEl.textContent = '⚠️ ' + err.message;
        errEl.style.display = 'block';
        btn.textContent = '🔑 Masuk';
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
