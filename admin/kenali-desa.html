<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kenali Desa - Admin</title>
  <link rel="icon" href="/images/logo.png" />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
  <style>
    .tab-nav{display:flex;gap:4px;border-bottom:2px solid var(--border);margin-bottom:24px;flex-wrap:wrap}
    .tab-btn{padding:10px 20px;font-family:Outfit;font-size:.88rem;font-weight:600;border:none;background:none;cursor:pointer;color:var(--text-muted);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
    .tab-btn.active{color:var(--primary);border-color:var(--primary)}
    .tab-btn:hover{color:var(--primary)}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .item-card{border:1px solid var(--border);border-radius:8px;padding:16px;margin-bottom:16px;background:#fcfcfc}
    .item-header{display:flex;justify-content:space-between;align-items:center;cursor:pointer;font-weight:700}
    .item-body{margin-top:16px;display:none;border-top:1px solid var(--border);padding-top:16px}
    .item-card.open .item-body{display:block}
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="sidebar" data-page="kenali-desa"></aside>
  <main class="admin-main">
    <div class="topbar">
      <div class="topbar-left"><div class="topbar-title">Kenali Desa</div></div>
      <div class="topbar-right"><a href="/kenali-desa.html" target="_blank" class="topbar-btn topbar-view-site">🌐 Website</a></div>
    </div>
    <div class="page-content">
      <div class="page-header-admin"><div><h1>🏘️ Kelola Kenali Desa</h1><p>Edit informasi 4 dusun, adat istiadat, dan tradisi lokal</p></div></div>

      <div class="admin-card">
        <div class="admin-card-body">
          <div class="tab-nav">
            <button class="tab-btn active" onclick="showTab('dusun')">🏘️ Data Dusun</button>
            <button class="tab-btn" onclick="showTab('tradisi')">🎭 Budaya & Tradisi</button>
          </div>

          <!-- Tab: Dusun -->
          <div class="tab-content active" id="tab-dusun">
            <p style="color:var(--text-muted);margin-bottom:20px;font-size:0.9rem">Atur informasi detail dari setiap dusun di Desa Kauman.</p>
            <div id="dusunContainer"></div>
            <button class="btn-admin btn-primary-admin" style="margin-top:24px" onclick="saveDusun()">💾 Simpan Data Dusun</button>
          </div>

          <!-- Tab: Tradisi -->
          <div class="tab-content" id="tab-tradisi">
            <p style="color:var(--text-muted);margin-bottom:20px;font-size:0.9rem">Atur adat istiadat, kesenian, kuliner, dan tradisi religi.</p>
            <div id="tradisiContainer"></div>
            <button class="btn-admin btn-light btn-sm-admin" style="margin-top:16px" onclick="addTradisi()">➕ Tambah Tradisi</button>
            <button class="btn-admin btn-primary-admin" style="margin-top:24px;display:block" onclick="saveTradisi()">💾 Simpan Tradisi</button>
          </div>

        </div>
      </div>
    </div>
  </main>
</div>

<script src="/admin/js/sidebar.js"></script>
<script src="/admin/js/admin.js"></script>
<script>
let desaData = {};
let dusunList = [];
let tradisiList = [];

document.addEventListener('DOMContentLoaded', async () => {
  if (!requireAuth()) return;
  desaData = await adminFetch('/desa') || {};
  dusunList = desaData.dusun_detail || [];
  tradisiList = desaData.budaya_tradisi || [];
  renderDusun();
  renderTradisi();
});

function showTab(name) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  document.getElementById('tab-' + name).classList.add('active');
  const idx = name === 'dusun' ? 0 : 1;
  document.querySelectorAll('.tab-btn')[idx].classList.add('active');
}

function toggleItem(el) {
  el.closest('.item-card').classList.toggle('open');
}

// ================= DUSUN =================
function renderDusun() {
  const container = document.getElementById('dusunContainer');
  if (!dusunList.length) {
    container.innerHTML = '<p>Tidak ada data dusun.</p>';
    return;
  }

  container.innerHTML = dusunList.map((d, i) => `
    <div class="item-card ${i === 0 ? 'open' : ''}">
      <div class="item-header" onclick="toggleItem(this)">
        <span>${d.icon || '🏘️'} ${d.nama || 'Dusun Baru'}</span>
        <span style="font-size:12px;color:var(--primary)">▼ Edit</span>
      </div>
      <div class="item-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group"><label class="form-label">Nama Dusun</label><input type="text" class="form-control" id="d_nama_${i}" value="${d.nama||''}"></div>
          <div class="form-group"><label class="form-label">Keunggulan/Tagline</label><input type="text" class="form-control" id="d_keunggulan_${i}" value="${d.keunggulan||''}"></div>
          <div class="form-group"><label class="form-label">Icon (Emoji)</label><input type="text" class="form-control" id="d_icon_${i}" value="${d.icon||''}"></div>
          <div class="form-group"><label class="form-label">Landmark</label><input type="text" class="form-control" id="d_landmark_${i}" value="${d.landmark||''}"></div>
          <div class="form-group"><label class="form-label">Jumlah Penduduk <small style="color:var(--primary)">(Otomatis)</small></label><input type="number" class="form-control" id="d_penduduk_${i}" value="${d.jumlah_penduduk||0}" readonly style="background:#f0f0f0;cursor:not-allowed"></div>
          <div class="form-group"><label class="form-label">Jumlah KK <small style="color:var(--primary)">(Otomatis)</small></label><input type="number" class="form-control" id="d_kk_${i}" value="${d.jumlah_kk||0}" readonly style="background:#f0f0f0;cursor:not-allowed"></div>
          <div class="form-group"><label class="form-label">Warna Utama (Hex)</label><input type="text" class="form-control" id="d_warna_${i}" value="${d.warna||''}"></div>
          <div class="form-group"><label class="form-label">Warna BG (Hex)</label><input type="text" class="form-control" id="d_warnabg_${i}" value="${d.warna_bg||''}"></div>
        </div>
        <div class="form-group"><label class="form-label">Sejarah Singkat</label><textarea class="form-control" rows="2" id="d_sejarah_${i}">${d.sejarah_singkat||''}</textarea></div>
        <div class="form-group"><label class="form-label">Karakteristik Warga</label><textarea class="form-control" rows="2" id="d_karakteristik_${i}">${d.karakteristik||''}</textarea></div>
        <div class="form-group"><label class="form-label">Mayoritas Agama <small style="color:var(--primary)">(Otomatis)</small></label><input type="text" class="form-control" id="d_agama_${i}" value="${d.mayoritas_agama||''}" readonly style="background:#f0f0f0;cursor:not-allowed"></div>
        
        <div class="form-group">
          <label class="form-label">Tradisi Khas (Pisahkan dengan koma)</label>
          <input type="text" class="form-control" id="d_tradisi_${i}" value="${(d.tradisi_khas||[]).join(', ')}">
        </div>

        <div class="form-group">
          <label class="form-label">Mayoritas Pekerjaan <small style="color:var(--primary)">(Otomatis dari Database)</small></label>
          <textarea class="form-control" rows="3" id="d_pekerjaan_${i}" readonly style="background:#f0f0f0;cursor:not-allowed">${JSON.stringify(d.mayoritas_pekerjaan||[], null, 2)}</textarea>
          <small style="color:var(--text-light)">Data ini dikalkulasi secara otomatis dari tabel penduduk berdasarkan dusun.</small>
        </div>
      </div>
    </div>
  `).join('');
}

async function saveDusun() {
  const updatedDusun = dusunList.map((_, i) => {
    let pekerjaan = [];
    try { pekerjaan = JSON.parse(document.getElementById(`d_pekerjaan_${i}`).value); } catch(e) {}
    
    return {
      nama: document.getElementById(`d_nama_${i}`).value,
      keunggulan: document.getElementById(`d_keunggulan_${i}`).value,
      sejarah_singkat: document.getElementById(`d_sejarah_${i}`).value,
      jumlah_penduduk: parseInt(document.getElementById(`d_penduduk_${i}`).value) || 0,
      jumlah_kk: parseInt(document.getElementById(`d_kk_${i}`).value) || 0,
      mayoritas_agama: document.getElementById(`d_agama_${i}`).value,
      landmark: document.getElementById(`d_landmark_${i}`).value,
      karakteristik: document.getElementById(`d_karakteristik_${i}`).value,
      tradisi_khas: document.getElementById(`d_tradisi_${i}`).value.split(',').map(s=>s.trim()).filter(s=>s),
      mayoritas_pekerjaan: pekerjaan,
      icon: document.getElementById(`d_icon_${i}`).value,
      warna: document.getElementById(`d_warna_${i}`).value,
      warna_bg: document.getElementById(`d_warnabg_${i}`).value,
    };
  });

  const res = await adminFetch('/desa', {
    method: 'PUT',
    body: JSON.stringify({ dusun_detail: updatedDusun })
  });

  if (res) {
    showToast('Data dusun berhasil disimpan!');
    dusunList = updatedDusun;
    renderDusun();
  }
}

// ================= TRADISI =================
function renderTradisi() {
  const container = document.getElementById('tradisiContainer');
  if (!tradisiList.length) {
    container.innerHTML = '<p>Belum ada data tradisi.</p>';
    return;
  }

  container.innerHTML = tradisiList.map((t, i) => `
    <div class="item-card">
      <div class="item-header" onclick="toggleItem(this)">
        <span>${t.icon || '🎭'} ${t.nama || 'Tradisi Baru'}</span>
        <div>
          <button class="btn-admin btn-danger btn-sm-admin" onclick="event.stopPropagation(); removeTradisi(${i})" style="margin-right:12px;padding:2px 8px">✕ Hapus</button>
          <span style="font-size:12px;color:var(--primary)">▼ Edit</span>
        </div>
      </div>
      <div class="item-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
          <div class="form-group"><label class="form-label">Nama Tradisi</label><input type="text" class="form-control" id="t_nama_${i}" value="${t.nama||''}"></div>
          <div class="form-group"><label class="form-label">Kategori</label>
            <select class="form-control" id="t_kat_${i}">
              <option value="Tradisi" ${t.kategori==='Tradisi'?'selected':''}>Tradisi</option>
              <option value="Religi" ${t.kategori==='Religi'?'selected':''}>Religi</option>
              <option value="Kesenian" ${t.kategori==='Kesenian'?'selected':''}>Kesenian</option>
              <option value="Kuliner" ${t.kategori==='Kuliner'?'selected':''}>Kuliner</option>
            </select>
          </div>
          <div class="form-group"><label class="form-label">Icon (Emoji)</label><input type="text" class="form-control" id="t_icon_${i}" value="${t.icon||''}"></div>
          <div class="form-group"><label class="form-label">Waktu Pelaksanaan</label><input type="text" class="form-control" id="t_waktu_${i}" value="${t.waktu_pelaksanaan||''}"></div>
        </div>
        <div class="form-group"><label class="form-label">Deskripsi</label><textarea class="form-control" rows="3" id="t_desc_${i}">${t.deskripsi||''}</textarea></div>
      </div>
    </div>
  `).join('');
}

function addTradisi() {
  tradisiList.push({
    nama: 'Tradisi Baru',
    kategori: 'Tradisi',
    deskripsi: '',
    waktu_pelaksanaan: 'Setiap Tahun',
    icon: '🎭'
  });
  renderTradisi();
  // Buka item terakhir
  setTimeout(() => {
    const cards = document.querySelectorAll('#tradisiContainer .item-card');
    if (cards.length > 0) cards[cards.length - 1].classList.add('open');
  }, 50);
}

function removeTradisi(idx) {
  if (confirm('Yakin ingin menghapus tradisi ini?')) {
    tradisiList.splice(idx, 1);
    renderTradisi();
  }
}

async function saveTradisi() {
  const updatedTradisi = tradisiList.map((_, i) => ({
    nama: document.getElementById(`t_nama_${i}`).value,
    kategori: document.getElementById(`t_kat_${i}`).value,
    deskripsi: document.getElementById(`t_desc_${i}`).value,
    waktu_pelaksanaan: document.getElementById(`t_waktu_${i}`).value,
    icon: document.getElementById(`t_icon_${i}`).value
  }));

  const res = await adminFetch('/desa', {
    method: 'PUT',
    body: JSON.stringify({ budaya_tradisi: updatedTradisi })
  });

  if (res) {
    showToast('Data budaya & tradisi berhasil disimpan!');
    tradisiList = updatedTradisi;
    renderTradisi();
  }
}
</script>
</body>
</html>
